name: Hotfix Lockfile Generator

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Generate package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Emit compressed lockfile
        shell: bash
        run: |
          echo 'WARDROPE_LOCKFILE_BEGIN'
          gzip -c package-lock.json | base64 -w0
          echo
          echo 'WARDROPE_LOCKFILE_END'
