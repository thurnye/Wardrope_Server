name: Product Import Type Fix

on:
  push:
    branches:
      - agent/product-link-import

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/product-link-import

      - name: Correct Node IncomingMessage type import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Wardrope.Infra/services/ProductSource/http-product-source.service.ts')
          text = path.read_text()
          old = "import { lookup } from 'node:dns/promises';\nimport { isIP } from 'node:net';\nimport {\n  request as httpsRequest,\n  type IncomingMessage,\n  type RequestOptions,\n} from 'node:https';"
          new = "import { lookup } from 'node:dns/promises';\nimport type { IncomingMessage } from 'node:http';\nimport { isIP } from 'node:net';\nimport {\n  request as httpsRequest,\n  type RequestOptions,\n} from 'node:https';"
          if old not in text:
              raise SystemExit('Expected import block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/product-import-import-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix product importer Node response type"
          git push origin HEAD:agent/product-link-import
