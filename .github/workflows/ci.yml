name: Wardrope Server CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
      CORS_ORIGINS: http://localhost:5173

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-fund

      - name: Capture resolved lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: package-lock.json
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Type check
        run: npm run type-check

      - name: Test HTTP behavior
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  commit-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/complete-private-image-storage'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/complete-private-image-storage

      - name: Download generated lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-lock.json
          path: generated-lockfile

      - name: Commit lockfile when changed
        run: |
          cp generated-lockfile/package-lock.json package-lock.json
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "Generated lockfile already matches the repository."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "lock server dependencies"
          git push origin HEAD:agent/complete-private-image-storage
